# Replaces /boot/grub/grub.cfg inside Ubuntu Server ISO (Ventoy conf_replace).
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set default=0
set timeout=1

menuentry "Install LocalRetail kiosk (autoinstall)" {
  set gfxpayload=text
  linux /casper/vmlinuz autoinstall ds=nocloud\;s=/ventoy/cidata/ nomodeset ---
  initrd /casper/initrd
}

menuentry "Install LocalRetail kiosk (autoinstall, cidata label)" {
  set gfxpayload=text
  linux /casper/vmlinuz autoinstall nomodeset ---
  initrd /casper/initrd
}
