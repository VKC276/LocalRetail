# Replaces /boot/grub/grub.cfg inside Ubuntu Server ISO (via Ventoy conf_replace).
# Boots autoinstall immediately — no manual "e" edit needed.
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set default=0
set timeout=2

menuentry "Install LocalRetail kiosk (autoinstall)" {
  set gfxpayload=keep
  linux /casper/vmlinuz autoinstall ds=nocloud\;s=/ventoy/cidata/ nomodeset ---
  initrd /casper/initrd
}

menuentry "Install Ubuntu Server (manual)" {
  set gfxpayload=keep
  linux /casper/vmlinuz nomodeset ---
  initrd /casper/initrd
}
